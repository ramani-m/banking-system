# ─── Shared Environment Variables ────────────────────────────────────────────
x-common-env: &common-env
  JWT_SECRET: "ramani-banking-super-secret-key-256-bits-minimum-length-required"
  DB_USER: postgres
  DB_PASSWORD: postgres
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_SERVERS: kafka:9092
  FRONTEND_URL: http://localhost:3000

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: banking-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "bash", "-c", "cub zk-ready localhost:2181 10 2>/dev/null"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: banking-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "kafka:9092", "1", "20"]
      interval: 10s
      timeout: 25s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ── Application Services ─────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: banking-api-gateway
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      ACCOUNT_SERVICE_URL: http://account-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      WALLET_SERVICE_URL: http://wallet-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    restart: unless-stopped

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service/Dockerfile
    container_name: banking-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_NAME: banking_auth
      MAIL_HOST: banking-mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: noreply@ramani.com
      MAIL_PASSWORD: ""
    restart: unless-stopped

  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    container_name: banking-user-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_NAME: banking_users
    restart: unless-stopped

  account-service:
    build:
      context: ../backend
      dockerfile: account-service/Dockerfile
    container_name: banking-account-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_NAME: banking_accounts
    restart: unless-stopped

  transaction-service:
    build:
      context: ../backend
      dockerfile: transaction-service/Dockerfile
    container_name: banking-transaction-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_NAME: banking_transactions
      ACCOUNT_SERVICE_URL: http://account-service:8083
    restart: unless-stopped

  wallet-service:
    build:
      context: ../backend
      dockerfile: wallet-service/Dockerfile
    container_name: banking-wallet-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_NAME: banking_wallets
    restart: unless-stopped

  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    container_name: banking-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      DB_HOST: postgres
      DB_NAME: banking_notifications
      MAIL_HOST: banking-mailpit
      MAIL_PORT: 1025
    restart: unless-stopped

  # ── Dev Tools ────────────────────────────────────────────────────────────────

  mailhog:
    image: axllent/mailpit:latest
    container_name: banking-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (Mailpit UI)

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banking-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ramani.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
